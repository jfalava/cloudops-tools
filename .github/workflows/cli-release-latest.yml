name: Release CLI Latest

on:
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "bun.lock"

concurrency:
  group: release-cli-latest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build latest (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64-modern
            binary: cloudops-tools-linux-x64
            archive: cloudops-tools-linux-x64.zip
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64-modern
            binary: cloudops-tools-windows-x64.exe
            archive: cloudops-tools-windows-x64.zip
          - name: macos-arm
            os: macos-latest
            target: bun-darwin-arm64
            binary: cloudops-tools-macos-arm64
            archive: cloudops-tools-macos-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native CLI binary
        shell: bash
        run: |
          BUILD_VERSION="$(node -p "require('./cli/package.json').version")"
          mkdir -p cli/dist
          bun build --compile --minify --sourcemap --bytecode \
            --target="${{ matrix.target }}" \
            --define BUILD_VERSION="\"${BUILD_VERSION}\"" \
            ./cli/src/app.ts \
            --outfile "./cli/dist/${{ matrix.binary }}"

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd cli/dist
          zip -r "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "cli/dist/${{ matrix.binary }}" -DestinationPath "cli/dist/${{ matrix.archive }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: cli/dist/${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}
          path: cli/dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Update latest release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move latest tag to current main commit
        shell: bash
        run: |
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: cloudops-tools-*

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CLI Latest (main)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: artifacts/**/*
