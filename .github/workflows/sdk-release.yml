name: Release SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag matches SDK version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag and sdk/package.json version match
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$(node -p "require('./sdk/package.json').version")"
          EXPECTED="sdk-v${VERSION}"

          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Tag '$TAG' does not match expected SDK tag '$EXPECTED'."
            exit 1
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate-tag
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
