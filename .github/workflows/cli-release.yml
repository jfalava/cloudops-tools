name: Release CLI

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag matches CLI version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag and cli/package.json version match
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="$(node -p "require('./cli/package.json').version")"

          if [[ "$TAG" != "$VERSION" && "$TAG" != "v$VERSION" ]]; then
            echo "Tag '$TAG' does not match cli/package.json version '$VERSION'."
            echo "Use '$VERSION' or 'v$VERSION'."
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64-modern
            binary: cloudops-tools-linux-x64
            archive: cloudops-tools-linux-x64.zip
            npm_dir: linux-x64
            npm_binary: cloudops-tools
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64-modern
            binary: cloudops-tools-windows-x64.exe
            archive: cloudops-tools-windows-x64.zip
            npm_dir: win32-x64
            npm_binary: cloudops-tools.exe
          - name: macos-arm
            os: macos-latest
            target: bun-darwin-arm64
            binary: cloudops-tools-macos-arm64
            archive: cloudops-tools-macos-arm64.zip
            npm_dir: darwin-arm64
            npm_binary: cloudops-tools

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native CLI binary
        shell: bash
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p cli/dist
          bun build --compile --minify --sourcemap --bytecode \
            --target="${{ matrix.target }}" \
            --define BUILD_VERSION="'\"'${BUILD_VERSION}'\"'" \
            ./cli/src/app.ts \
            --outfile "./cli/dist/${{ matrix.binary }}"

      - name: Stage binary for npm platform package
        shell: bash
        run: cp "cli/dist/${{ matrix.binary }}" "cli/npm/${{ matrix.npm_dir }}/${{ matrix.npm_binary }}"

      - name: Package artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd cli/dist
          zip -r "${{ matrix.archive }}" "${{ matrix.binary }}"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "cli/dist/${{ matrix.binary }}" -DestinationPath "cli/dist/${{ matrix.archive }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: cli/dist/${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: cli/dist/${{ matrix.binary }}
          if-no-files-found: error

      - name: Upload npm platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm_dir }}
          path: cli/npm/${{ matrix.npm_dir }}/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: cloudops-tools-*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
