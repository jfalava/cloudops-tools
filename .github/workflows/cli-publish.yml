name: Publish CLI to npm

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Run ID of the Release CLI workflow (required for artifact download)"
        required: true
        type: string
      release_sha:
        description: "Git SHA of the release commit"
        required: true
        type: string
  workflow_run:
    workflows:
      - Release CLI
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  publish-platform-packages:
    name: Publish ${{ matrix.pkg }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - npm_dir: darwin-arm64
            pkg: "@cloudops-tools/cli-darwin-arm64"
            binary_artifact: cloudops-tools-macos-arm64
            npm_binary: cloudops-tools
          - npm_dir: linux-x64
            pkg: "@cloudops-tools/cli-linux-x64"
            binary_artifact: cloudops-tools-linux-x64
            npm_binary: cloudops-tools
          - npm_dir: win32-x64
            pkg: "@cloudops-tools/cli-win32-x64"
            binary_artifact: cloudops-tools-windows-x64.exe
            npm_binary: cloudops-tools.exe

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Enforce trusted publishing auth
        shell: bash
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Download platform binary artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.binary_artifact }}
          path: /tmp/cloudops-tools-binaries/${{ matrix.npm_dir }}/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.release_run_id }}

      - name: Stage binary in npm package directory
        shell: bash
        run: |
          cp "/tmp/cloudops-tools-binaries/${{ matrix.npm_dir }}/${{ matrix.binary_artifact }}" \
            "cli/npm/${{ matrix.npm_dir }}/${{ matrix.npm_binary }}"

          if [[ "${{ matrix.npm_dir }}" != "win32-x64" ]]; then
            chmod +x "cli/npm/${{ matrix.npm_dir }}/${{ matrix.npm_binary }}"
          fi

      - name: Verify package contents before publish
        shell: bash
        run: |
          test -f "cli/npm/${{ matrix.npm_dir }}/package.json"
          test -f "cli/npm/${{ matrix.npm_dir }}/README.md"
          test -f "cli/npm/${{ matrix.npm_dir }}/${{ matrix.npm_binary }}"
          ls -la "cli/npm/${{ matrix.npm_dir }}/"

      - name: List package contents
        run: ls -la cli/npm/${{ matrix.npm_dir }}/

      - name: Check if version already published
        id: check
        shell: bash
        run: |
          VERSION="$(node -p "require('./cli/npm/${{ matrix.npm_dir }}/package.json').version")"
          if npm view "${{ matrix.pkg }}@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ${{ matrix.pkg }}
        if: steps.check.outputs.skip != 'true'
        working-directory: cli/npm/${{ matrix.npm_dir }}
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --access public --provenance

  publish-main:
    name: Publish main CLI package
    needs: publish-platform-packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Enforce trusted publishing auth
        shell: bash
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG="$(git tag --points-at HEAD | head -n 1)"
          if [[ -z "$TAG" ]]; then
            echo "No git tag found for commit $(git rev-parse --short HEAD)."
            exit 1
          fi

          VERSION="$(node -p "require('./cli/package.json').version")"

          if [[ "$TAG" != "$VERSION" && "$TAG" != "v$VERSION" ]]; then
            echo "Release tag ($TAG) does not match cli/package.json version ($VERSION)."
            exit 1
          fi

      - name: Preview package contents
        working-directory: cli
        run: npm pack --dry-run

      - name: Check if main CLI version already published
        id: check_main
        shell: bash
        run: |
          VERSION="$(node -p "require('./cli/package.json').version")"
          if npm view "@cloudops-tools/cli@${VERSION}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.check_main.outputs.skip != 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
        run: npm publish --access public --provenance
