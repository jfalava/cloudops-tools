name: Publish CLI to npm

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release CLI
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG="$(git tag --points-at HEAD | head -n 1)"
          if [[ -z "$TAG" ]]; then
            echo "No git tag found for commit $(git rev-parse --short HEAD)."
            exit 1
          fi

          VERSION="$(node -p "require('./cli/package.json').version")"

          if [[ "$TAG" != "$VERSION" && "$TAG" != "v$VERSION" ]]; then
            echo "Release tag ($TAG) does not match cli/package.json version ($VERSION)."
            exit 1
          fi

      - name: Preview package contents
        working-directory: cli
        run: npm pack --dry-run

      - name: Publish package
        working-directory: cli
        run: npm publish --access public --provenance
